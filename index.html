on><div class="modal-caption" id="modalCaption"></div></div></div> <script>
(() => {
  const cards = [...document.querySelectorAll('.template-box')];
  const modal = document.getElementById('modal');
  const modalImage = document.getElementById('modalImage');
  const caption = document.getElementById('modalCaption');
  let current = 0;

  const show = (index) => {
    current = (index + cards.length) % cards.length;
    const card = cards[current];
    const image = card.querySelector('img');
    const title = card.querySelector('.card-title span')?.textContent || `قالب ${current + 1}`;
    modalImage.src = image.src;
    modalImage.alt = image.alt;
    caption.textContent = title;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  };

  const close = () => {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  };

  cards.forEach((card, index) => {
    card.addEventListener('click', () => show(index));
  });
  document.querySelector('.modal-close').addEventListener('click', close);
  document.querySelector('.modal-prev').addEventListener('click', () => show(current - 1));
  document.querySelector('.modal-next').addEventListener('click', () => show(current + 1));
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });

  document.getElementById('jump').addEventListener('click', () => {
    document.getElementById('templates').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('jump2').addEventListener('click', () => {
    document.getElementById('adminpanel').scrollIntoView({behavior:'smooth', block:'start'});
  });

  const adminCards = [...document.querySelectorAll('.adminshot-box')];
  adminCards.forEach((card, index) => {
    card.addEventListener('click', () => {
      const image = card.querySelector('img');
      const title = card.querySelector('.adminshot-caption span')?.textContent || '';
      modalImage.src = image.src;
      modalImage.alt = image.alt;
      caption.textContent = title;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      const nav = index === 0 ? adminCards[1] : adminCards[0];
      const prevBtn = document.querySelector('.modal-prev');
      const nextBtn = document.querySelector('.modal-next');
      const switchTo = () => nav.click();
      prevBtn.onclick = switchTo;
      nextBtn.onclick = switchTo;
    });
  });
  document.querySelector('.modal-close').addEventListener('click', () => {
    document.querySelector('.modal-prev').onclick = () => show(current - 1);
    document.querySelector('.modal-next').onclick = () => show(current + 1);
  });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, {threshold:.08});
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
})();
</script> </body></html>
